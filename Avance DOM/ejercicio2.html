<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2: seleccion de elementos por clase</title>
</head>
<body>
    <div class="clase-1">Elemento1</div>
    <div class="clase-1">Elemento2</div>
    <div class="clase-1">Elemento3</div>
    <script>
        const elementos=document.getElementsByClassName('clase-1');
        for(const elemento of elementos){
            elemento.style.backgroundColor='green';
        }
    </script>
</body>
</html>
