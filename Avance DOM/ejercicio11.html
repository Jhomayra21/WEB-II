<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar el elemento con removeChild</title>
</head>
<body>
    <div id="contenedor">
        <div id="elementoEliminado">Elemento null</div>
    </div>
    <script>
        const elementosElim=document.getElementById('elementoEliminado');
        const elementoPadre=elementosElim.parentElement;
        elementoPadre.removeChild(elementosElim);
    </script>
</body>
</html>
