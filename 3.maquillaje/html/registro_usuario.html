<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/registro_usuario.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="left-section">
                
            </div>
            <div class="right-section">
                <h2>Crear una cuenta</h2>
                <div class="social-login">
                    <button>
                        <img src="https://www.google.com/favicon.ico" alt="Google">
                        Refistrarse con Google
                    </button>
                    <button>
                        <img src="https://www.facebook.com/favicon.ico" alt="Facebook">
                        Registrarse con Facebook
                    </button>
                </div>
                <div class="divider">— OR —</div>
                <form>
                    <div class="form-group">
                        <label for="full-name">Nombre completo</label>
                        <input type="text" id="full-name" placeholder="Nombre Usuario">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electronico</label>
                        <input type="email" id="email" placeholder="Email ">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Contraseña">
                    </div>
                    <button type="submit" class="create-account-btn">Crear cuenta</button>
                </form>
                <div class="login-link">
                    Ya tienes cuenta? <a href="#">Inniciar Sesion</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
